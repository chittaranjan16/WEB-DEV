<!-- Core Concepts & Syntax
 
Anchor Tag (<a>): Used to create clickable hyperlinks on a web page syntax: <a href="URL">Link Text</a>.

href Attribute: Specifies the destination URL or file path where the link points. Without href, the tag is unclickable and loses link functionality.

target Attribute: Controls where the linked document opens:

_self (Default): Opens the link in the same tab/window.

_blank: Opens the link in a new tab/window.

Internal vs. External Links
External Links: Point to outside websites using absolute URLs (e.g., href="[https://www.google.com](https://www.google.com)").

Internal Links: Connect pages within your own project directory using relative file paths (e.g., href="about.html"). -->
