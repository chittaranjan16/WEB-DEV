<!DOCTYPE html>
<html lang="en">
<head>
    <title>College Information</title>
</head>
<body>
    <table border="1" >
        <tr>
            <th colspan="3">Student Details</th>
        </tr>
        <tr>
            <th>College Name</th>
            <th>Course</th>
            <th>Duration</th>
        </tr>

        <tr>
            <td>RV College of Engineering</td>
            <td>B.E. Computer Science</td>
            <td>4</td>
        </tr>

        <tr>
            <td>BMS College of Engineering</td>
            <td>B.E. Information Science</td>
            <td>4</td>
        </tr>

        <tr>
            <td>Ramaiah Institute of Technology</td>
            <td>M.Tech Software Engineering</td>
            <td>2</td>
        </tr>
    </table>
</body>
</html>

<!-- 
Core Table Elements & Structure

<table>: The root container element for tabular data.

<tr> (Table Row): Defines a single horizontal row within the table.

<th> (Table Header): Defines a header cell; text is bold and centered by default.

<td> (Table Data): Defines a standard data cell; text is regular and left-aligned by default.

Attributes (Class Notes Reference)
border: Adds a visual outline/border to table cells (e.g., border="1"). Modern styling uses CSS instead.

cellspacing: Controls space between individual table cells (e.g., cellspacing="10"). Legacy attribute replaced by CSS in production.

colspan: Spans a cell horizontally across multiple columns (e.g., <th colspan="3"> merges 3 columns into one wide header). -->
