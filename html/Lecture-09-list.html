<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html lists</title>

    <style>
        ul li::marker{
            color: blue;
            content: "@";
        }
    </style>
</head>
<body>
    <h1>ordered list</h1>
    <ol>
        <li>rohit</li>
        <li>virat</li>
        <li>dhoni</li>
        <li>hardik</li>
        <li>gill</li>

    </ol>



    <ol type="A">
        <li>rohit</li>
        <li>virat</li>
        <li>dhoni</li>
        <li>hardik</li>
        <li>gill</li>

    </ol>


    <h1>unordered list</h1>
    <ul>
        <li>rohit</li>
        <li>virat</li>
        <li>dhoni</li>
        <li>hardik</li>
        <li>gill</li>
    </ul>


    <h1>describtive list</h1>

    <dl>
        <dt>biryani</dt>
        <dd>gtrhtrhtrgwfeghth</dd>

        <dt>pulao</dt>
        <dd>fdghthytjuyjuyyuj</dd>

        <dt>rice</dt>
        <dd>sfreytuyiy7u8i</dd>
    </dl>
</body>
</html>
