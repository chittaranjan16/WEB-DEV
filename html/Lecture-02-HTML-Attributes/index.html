<!DOCTYPE html>
<html lang="en">
<head>
    <title>student Profile Page</title>
</head>
<body>
    <marquee scrollamount="100">
    Welcome to my website
    </marquee>


    <marquee behavior="alternate">
    Welcome
    </marquee>


    <marquee scrolldelay="100">
    Welcome DELAY
    </marquee>


    <h1>----------------------------</h1>
    <h1 ID = "PROFILE">MY PROFILE</h1>
    <h1>----------------------------</h1>
    <h2 ID = "NAME">NAME : </h2>
    <h2 ID = "ABT ME">ABOUT ME  : </h2>
    <h2>EDUCATION : </h2>
    <h2>CAREER GOAL : </h2>
    <h2>SKILLS : </h2>
    <h1>----------------------------</h1>
</body>
</html>


<!-- Core Concepts & Syntax

HTML Attribute: Provides additional information or functionality to an HTML tag.

Syntax: Always written inside the opening tag as key-value pairs: <tag attribute="value">.

Multiple Attributes: A single tag can contain multiple space-separated attributes (e.g., <h1 id="heading" title="Main Header">).

Essential Attributes
id Attribute: Assigns a unique identifier to an HTML element.

Uniqueness Rule: An id must be unique on a single page (e.g., studentName vs. careerGoal). Avoid reusing the same ID across multiple elements.

title Attribute: Adds hover tooltip text over the element in web browsers.

Scrolling Attributes (Class Notes Reference)
Historical Context: Attributes like scrollamount, scrolldelay, and behavior (used on <marquee>) control motion, speed, and delay.

Note: These scrolling elements are deprecated in modern HTML standards and should not be used in production projects. -->
