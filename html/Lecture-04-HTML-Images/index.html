<!-- Here is a concise, point-wise summary of Lecture 4 — HTML Images:

Core Concepts & Syntax
<img> Tag: Used to embed images into a web page. It is a self-closing/void element, meaning it does not require a closing </img> tag.

src Attribute: Specifies the image file path or URL (e.g., src="images/student.jpg").

alt Attribute: Provides fallback description text for screen readers or when the image fails to load.

width & height Attributes: Specify display dimensions in pixels (e.g., width="200" height="200").

File Structure & Relative Paths
Directory Setup: Recommended structure involves placing image assets inside a dedicated subfolder (e.g., Lecture-04-HTML-Images/images/).

Folder Traversal: Referencing subfolder assets from index.html requires relative file paths: <img src="images/photo.jpg">. -->



<!-- Core Concepts & Path Types
Path Definition: A route or location address telling the browser where to find a resource (HTML file, image, CSS, JS).

Absolute Path: The complete full URL or full system file path (e.g., [https://example.com/images/student.jpg](https://example.com/images/student.jpg)). It points to the same location regardless of where the referencing HTML file lives.

Relative Path: A location defined relative to the current HTML file's location in the project tree.

Navigation Syntax
Same Directory (./): References a file in the current folder (e.g., ./images/student.jpg or images/student.jpg).

Subfolder Traversal: Enters a child folder by specifying its name (e.g., pages/about.html).

Parent Directory (../): Moves up one directory level into the parent folder (e.g., ../images/student.jpg moves up from pages/ to root, then enters images/). -->
