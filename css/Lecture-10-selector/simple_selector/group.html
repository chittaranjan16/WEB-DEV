<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping Selector</title>
    <link rel="stylesheet" href="simple-selectors.css">
</head>
<body>
    <h1>Grouping Selector</h1>
    <h2>Heading one</h2>
    <p>Paragraph one</p>
    <h2>Heading two</h2>
    <p>Paragraph two</p>
    <button>Example button</button>
</body>
</html>




<!-- NOTES
1. Syntax: h1, h2, p { property: value; }
2. A comma groups separate selectors that should share the same declarations.
3. Each selector is matched independently; the comma does not mean “inside” or “next to”.
4. Grouping avoids repeating the same CSS declarations in multiple rules.
5. External CSS: simple-selectors.css (shared simple-selector stylesheet).
-->
