<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Selector</title>
    <link rel="stylesheet" href="simple-selectors.css">
</head>
<body>
    <h1>Class Selector</h1>
    <p class="highlight">This paragraph has the highlight class.</p>
    <p>This paragraph has no class, so it is not highlighted.</p>
    <div class="highlight">A class can be used on different kinds of elements.</div>
    <p class="tip">A second class can style a different group.</p>
</body>
</html>




<!-- NOTES
1. Syntax: .className { property: value; }
2. In HTML, write the class without a dot: class="highlight".
3. In CSS, start the class selector with a dot: .highlight.
4. The same class can be reused on many elements; an element can also have multiple classes.
5. Use a class when you want to style a reusable group of elements.
6. External CSS: simple-selectors.css (shared with class.html, id.html, group.html, universal.html).
-->
