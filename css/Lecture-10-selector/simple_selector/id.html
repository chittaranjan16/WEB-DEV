<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Selector</title>
    <link rel="stylesheet" href="simple-selectors.css">
</head>
<body>
    <h1>ID Selector</h1>
    <p id="main-message">This paragraph is selected by its unique ID.</p>
    <p class="highlight">This uses a class instead of an ID.</p>
</body>
</html>






<!-- NOTES
1. Syntax: #idName { property: value; }
2. In HTML, write id="main-message"; in CSS, select it with #main-message.
3. An ID should be unique within one HTML document.
4. IDs have higher specificity than classes and element selectors.
5. Prefer classes for reusable styling; use IDs for unique elements when appropriate.
6. External CSS: simple-selectors.css (shared simple-selector stylesheet).
-->
