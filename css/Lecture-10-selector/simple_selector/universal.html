<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Selector</title>
    <link rel="stylesheet" href="simple-selectors.css">
</head>
<body>
    <h1>Universal Selector</h1>
    <section>
        <h2>Inside a section</h2>
        <p>The universal selector can match every element.</p>
        <button>Button</button>
    </section>
    <p>Another paragraph.</p>
</body>
</html>




<!-- NOTES
1. Syntax: * { property: value; }
2. The asterisk (*) is the universal selector and matches all elements.
3. It is often used for a basic reset, for example * { box-sizing: border-box; }.
4. Keep universal rules simple; broad styling can affect every element on the page.
5. External CSS: simple-selectors.css (shared simple-selector stylesheet).
-->
