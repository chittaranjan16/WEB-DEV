<!DOCTYPE html>

    <style>

        body{
            font-family :'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container{
            background-color: aqua;
            width: 300px;
            height: 400px;
            position: relative;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            margin: 100px auto;
            border-radius: 15px;
            z-index: 4;
        }

        .container:hover{
            transform: scale(1.05);
        }

        .content h1{
             position: absolute;
             left: -27px;
             bottom: -90px;
             font-size: 150px;
             z-index: 5;
             color: black;
            -webkit-text-stroke: 1.5px white;
        }

        .section{
            display: grid;
            grid-template-columns: repeat(5,auto);
        }
    </style>
</head>
