
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>
    <style>
       

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.container {
    width: 500px;
    height: 600px;
    
    background-color: rgba(0, 0, 0, 0.753);
    border: 4px solid black;
    border-radius: 15px;

    display: grid;
    grid-template-columns: repeat(4, auto);
    grid-template-rows: 150px auto;
    gap: 3px;
   
}
    

.box {
    border: 3px solid rgb(255, 252, 252);
    background-color: rgba(0, 0, 0, 0.452);
    border-radius: 10px;

    color: aliceblue;
    font-weight: bolder;
    font-size: 30PX;
    
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

.box1{
    grid-column:1/5; 
    position: relative; 
}

span{
    position: absolute;
    right: 10px;
    bottom: 10px;
    font-size: 40px;
}

.box2{
    grid-column:1/3;
    background-color: rgba(255, 0, 0, 0.678);
}

.box12{
    grid-row:5/7;
    grid-column: 4/5;
}

.box17{
    grid-column: 1/3;
}



    </style>
</head>
<body>

    <div class="container">
        <div class="box box1"><span>4*3+1</span></div>
        <div class="box box2">AC</div>
        <div class="box box3"  style="background-color: rgba(94, 92, 92, 0.137);">/</div>
        <div class="box box4" style="background-color: rgba(94, 92, 92, 0.137);">*</div>
        <div class="box box5">7</div>
        <div class="box box6">8</div>
        <div class="box box7">9</div>
        <div class="box box8" style="background-color: rgba(94, 92, 92, 0.137);">-</div>
        <div class="box box9">4</div>
        <div class="box box10">5</div>
        <div class="box box11">6</div>
        <div class="box box12">=</div>
        <div class="box box13" style="background-color: rgba(94, 92, 92, 0.137);">+</div>
        <div class="box box14">1</div>
        <div class="box box15">2</div>
        <div class="box box16">3</div>
        <div class="box box17">0</div>
        <div class="box box18">.</div>
       
    </div>

</body>
</html>
