<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honda Racing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .hero-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    /* Background Video */
    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 0;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: brightness(0.65); /* Darkens video to make text pop */
    }

    /* Honda Racing Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      position: absolute;
      top: 0;
      width: 100%;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-honda {
      color: #e60012; /* Honda Red */
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
    }

    .logo-sub {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      border-left: 2px solid #e60012;
      padding-left: 10px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #e60012;
    }

    /* Hero Text Content */
    .overlay-content {
      position: absolute;
      bottom: 20%;
      left: 60px;
      color: #ffffff;
      z-index: 1;
      max-width: 650px;
    }

    .tagline {
      color: #e60012;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .overlay-content h1 {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
      font-style: italic;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
    }

    .overlay-content p {
      font-size: 16px;
      color: #ddd;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .btn-racing {
      display: inline-block;
      padding: 14px 36px;
      background-color: #e60012;
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      text-decoration: none;
      transform: skewX(-12deg); /* Racing slanting style */
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .btn-racing span {
      display: inline-block;
      transform: skewX(12deg); /* Straightens text back */
    }

    .btn-racing:hover {
      background-color: #ffffff;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <!-- Honda Racing Background Video -->
    <video id="hondaVideo" class="bg-video" autoplay loop muted poster="honda-poster.jpg">
      <source src="/asset/honda.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="brand">
        <a href="#" class="logo-honda">Honda</a>
        <span class="logo-sub">Racing</span>
      </div>
      <ul class="nav-links">
        <li><a href="#">Cars</a></li>
        <li><a href="#">Motorsport</a></li>
        <li><a href="#">Type R</a></li>
        <li><a href="#">Technology</a></li>
      </ul>
    </nav>

    <!-- Overlay Content -->
    <div class="overlay-content">
      <div class="tagline">The Power of Dreams</div>
      <h1>Born on the Track</h1>
      <p>Engineered for maximum performance and pure speed. Experience high-octane Honda racing technology built to dominate every curve.</p>
      <a href="#" class="btn-racing"><span>Explore Models</span></a>
    </div>
  </div>

  
</script>
</body>
</html>
