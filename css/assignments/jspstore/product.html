
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JSpiders Products</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                JSpiders
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">
                            Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Admin</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>


    <!-- PAGE HEADING -->
    <div class="container text-center my-5">
        <h1 class="fw-bold">Our Products</h1>
        <p class="text-secondary">
            Explore our latest collection
        </p>
    </div>


    <!-- PRODUCT CARDS -->
    <div class="container mb-5">
        <div class="row g-4">

            <!-- Product 1 -->
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="card product-card shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80"
                        class="card-img-top product-image"
                        alt="Headphones">

                    <div class="card-body">
                        <h5 class="card-title">Wireless Headphones</h5>

                        <h5 class="text-success">₹1,499</h5>

                        <p class="text-warning mb-3">
                            ★★★★☆ <span class="text-dark">4.5/5</span>
                        </p>

                        <button class="btn btn-primary w-100">
                            Buy Now
                        </button>
                    </div>

                </div>
            </div>


            <!-- Product 2 -->
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="card product-card shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"
                        class="card-img-top product-image"
                        alt="Red sneaker">

                    <div class="card-body">
                        <h5 class="card-title">Sports Sneakers</h5>

                        <h5 class="text-success">₹2,499</h5>

                        <p class="text-warning mb-3">
                            ★★★★☆ <span class="text-dark">4.2/5</span>
                        </p>

                        <button class="btn btn-primary w-100">
                            Buy Now
                        </button>
                    </div>

                </div>
            </div>


            <!-- Product 3 -->
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="card product-card shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80"
                        class="card-img-top product-image"
                        alt="Wrist watch">

                    <div class="card-body">
                        <h5 class="card-title">Classic Wrist Watch</h5>

                        <h5 class="text-success">₹1,999</h5>

                        <p class="text-warning mb-3">
                            ★★★★★ <span class="text-dark">4.7/5</span>
                        </p>

                        <button class="btn btn-primary w-100">
                            Buy Now
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>




    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
