<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Student Registration</title>

    <style>
      h2 {
        color: rgb(38, 0, 255);
      }
      /* internal css */
     
    </style>
</head>
<body> 
    
    <h1 style="color: rgb(253, 0, 0);">Student Registration</h1>                       
    <!-- inline css -->

    <h2>Name</h2>
    <h2>Username</h2>
    <h2>Password</h2>
    <h3>Email</h3>
    <h3>Mobile</h3>



    <link rel="stylesheet" href="styles.css">
    <!-- external css  -->
</body>
</html>




<!-- Core Concepts & CSS Syntax
 
CSS (Cascading Style Sheets): Language used to style, lay out, and visually design HTML structural elements.

Basic Syntax: selector { property: value; }

Selector: Targets the HTML element (e.g., h1).

Property: The visual feature to modify (e.g., color).

Value: The specific style assignment (e.g., blue).

The Three Methods of Applying CSS
Inline CSS: Applied directly onto an individual HTML tag using the style attribute.

Example: <h1 style="color: blue;">Header</h1>

Internal CSS: Embedded inside a <style> block within the <head> of an HTML document.

Example: <style> h1 { color: blue; } </style>

External CSS: Written in an independent .css file and linked to the HTML file via the <link> tag inside <head>.

Example: <link rel="stylesheet" href="styles.css"> -->
