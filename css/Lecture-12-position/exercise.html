<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position exercise1</title>

    <style>
        #container{
            width: 700px;
            height: 700px;
            background-color: rgb(12, 241, 4);

            position: relative;

        }

        #a{
            width: 200px;
            height: 200px;
            background-color: brown;

            position: absolute;
            right: 0px;
        }

         #b{
            width: 200px;
            height: 200px;
            background-color: brown;

            position: absolute;
            right: 0px;
            bottom: 0px;
            
        }


         #c{
            width: 200px;
            height: 200px;
            background-color: brown;

            position: absolute;
            left: 0px;
            bottom: 0px;
            
        }


         #d{
            width: 200px;
            height: 200px;
            background-color: brown;

            position: absolute;
            left: 0px;
            top: 0px;
            
        }


         #e{
            width: 200px;
            height: 200px;
            background-color: brown;
            border-radius: 50%;


            position: absolute;
            left: 250px;
            top: 250px;
        }


        
        
    
    </style>
</head>
<body>
    <div id="container">
        
        <div id="a"></div>
        <div id="b"></div>
        <div id="c"></div>
        <div id="d"></div>
        <div id="e"></div>
       
    </div>
</body>
</html>
