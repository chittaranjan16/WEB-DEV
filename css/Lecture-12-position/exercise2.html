<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position exercise 2 </title>

    <style>
        #container{
            width: 900px;
            height: 900px;
            
            

            position: relative;
            left: 500px;

        }

        div{
            border-radius: 10px;
        }
        #a{
            width: 200px;
            height: 200px;
            background-color: red;
            

            position: absolute;
            left: 350px;
        }


        #g{
            width: 200px;
            height: 200px;
            background-color: green ;

            position: absolute;
            left: 350px;
            bottom: 0px;
        }

        /* 2level */
        #d{
            width: 200px;
            height: 200px;
            background-color: indigo;

            position: absolute;
            left: 0px;
            top: 150px;
            
        }
         #b{
            width: 200px;
            height: 200px;
            background-color: orange;

            position: absolute;
            right: 0px;
            top: 150px;
            
        }


         #c{
            width: 200px;
            height: 200px;
            background-color:blue;

            position: absolute;
            left: 0px;
            bottom: 150px;
            
        }

         #f{
            width: 200px;
            height: 200px;
            background-color: yellow;

            position: absolute;
            right: 0px;
            bottom: 150px;
            
        }


         


         #e{
            width: 200px;
            height: 200px;
            background-color: violet;
            border-radius: 50%;


            position: absolute;
            left: 350px;
            top: 350px;
        }


        
        
    
    </style>
</head>
<body>
    <div id="container">
        
        <div id="a"></div>
        <div id="b"></div>
        <div id="c"></div>
        <div id="d"></div>
        <div id="e"></div>
        <div id="f"></div>
        <div id="g"></div>
       
    </div>
</body>
</html>
