<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        #container{
            background-color: black;
            position: relative;
            width: 600px;
            height: 600px;
        }

        #box1{
            background-color: aqua;
            position: absolute;
            width: 100px;
            height: 100px;
            z-index: 1;
        }

         #box2{
            background-color: red;
            position: absolute;
            width: 100px;
            height: 100px;
            z-index: 2;
            left: 50px;
            top: 50px;
           
        }

         #box3{
            background-color: greenyellow;
            position: absolute;
            width: 200px;
            height: 100px;
            z-index: 0;
            left: 100px;
            top: 100px;
            
        }


        #box4{
            background-color: pink;
            position: absolute;
            width: 100px;
            height: 100px;
            z-index: 1;
            left: 300px;
        }

         #box5{
            background-color: orange;
            position: absolute;
            width: 100px;
            height: 100px;
            z-index: 2;
            left: 250px;
            top: 50px;
           
        }



    </style>
</head>
<body>
    <div id="container" >
        <div id="box1"></div>
        <div id="box2"></div>
        <div id="box3"></div>
        <div id="box4"></div>
        <div id="box5"></div>
    </div>
</body>
</html>
