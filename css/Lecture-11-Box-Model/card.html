<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>

    <style>
        #container{
            background-color: black;
            border: 6px solid orange;
            border-radius: 10px;
            padding: 20px;
            width: 250px;


            margin-left: 800px;
            margin-top: 100px;
            
        }

        #lower{
            color: #f0f8ff;
            font-size: 10px;
        }

        img{
            width: 247px;
            height: 340px;
            border-radius: 5px;
            border: 4px solid orange;
        }

        #lower h1{
            margin-left: 70px;
            color: orange;
        }


        .s:hover{
           background-color: blueviolet;
        }

        .m:hover{
           background-color: greenyellow;
        }

        .l:hover{
           background-color: yellow;
        }

        .xl:hover{
           background-color: pink;
        }

        .xxl:hover{
           background-color: red;
        }


        #price{
            font-size: 30px;
            color: orange;
        }

        #cb{
            margin-left: 25px;
            padding: 10px;
            width: 200px;
            border-radius: 15px;
            background-color: orange;
        }


         #cb:hover{
            background-color: blue;
            color: orange;
            
         }
    </style>

</head>
<body>
    <div id="container">
        <img src="https://m.media-amazon.com/images/I/71qxdLfZniL._SY741_.jpg">

        <div id="lower">
            <h1>Van Heusen</h1>

            <h2>Men's Cotton Solid Regular Fit Collar Polo T-Shirt</h2>
            <h3>4.0 ★★★★☆ (45.2K)</h3>
            <h3>700+ bought in past month</h3>

            <button class="s">S</button>
            <button class="m">M</button>
            <button class="l">L</button>
            <button class="xl">XL</button>
            <button class="xxl">XXL</button>
            <br><br>

            <span id="price"><b>₹521</b></span>
            <span>M.R.P: <s>₹1,999</s> (53% off)</span>

            <h4>FREE delivery Sat, 10 Oct <br>Fastest delivery Tomorrow 10 am - 2 pm</h4>

            <button id="cb">Add to Cart</button>

        </div>
        
    </div>
</body>
</html>
