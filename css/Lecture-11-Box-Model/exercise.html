<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise box model 1</title>

    <style>
        div{
            width: 90px;
            height: 90px;
            border: 5px solid red;
            background-color: aqua;
        }


        #a{
            margin-left: 0px;
            margin-top: 0px;
            
        }

        #b{
            margin-left: 100px;
            margin-top: 0px;
            
        }

        #c{
            margin-left: 100px;
            margin-top: -200px;
            border-radius: 50px; 
        }

        #d{
            margin-left: 200px;
            margin-top: 0px;
            border-radius: 50px; 
        }

        #e{
            margin-left: 200px;
            margin-top: 0px; 
        }

        #f{
            margin-left: 300px;
            margin-top: 0px; 
        }

        #g{
            margin-left: 300px;
            margin-top: -200px;
            border-radius: 50px; 
        }


    </style>
</head>


<body>
   
    <div id="a"></div>
    <div id="b"></div>
    <div id="c"></div>
    <div id="d"></div>
    <div id="e"></div>
    <div id="f"></div>
    <div id="g"></div>
   
</body>
</html>
