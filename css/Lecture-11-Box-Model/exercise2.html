<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise box model 2</title>


    <style>
        div{
            border: 5px solid rgb(102, 255, 0);
            background-color: blueviolet;

            width: 90px;
            height: 90px;
            border-radius: 5px;
        }


        #a{
            margin-top: 0px;
            margin-left: 0px;
        }

        #b{
            margin-top: 0px;
            margin-left: 100px;
        }

        #c{
            margin-top: 0px;
            margin-left: 200px;
        }

        #d{
            margin-top: -200px;
            margin-left: 300px;
        }

        #e{
            margin-top: -200px;
            margin-left: 400px;
        }
        
        #f{
            margin-top: 0px;
            margin-left: 500px;
        }

        #g{
            margin-top: 0px;
            margin-left: 600px;
        }


    </style>
</head>
<body>
    <div id="a"></div>
    <div id="b"></div>
    <div id="c"></div>
    <div id="d"></div>
    <div id="e"></div>
    <div id="f"></div>
    <div id="g"></div>
   
    

    


</body>
</html>
